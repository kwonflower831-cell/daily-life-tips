<p>전자레인지 안쪽이 얼룩투성이라면, 물 한 컵으로 먼저 불려 보세요.</p>
<h3>순서</h3><ol><li>내열 컵에 물 한 컵을 넣고 3분 돌리기</li><li>문을 닫은 채 5분 그대로 두기 (김이 얼룩을 불려 줘요)</li><li>컵은 뜨거우니 조심해서 꺼내고, 젖은 행주로 쓱 닦기</li></ol>
